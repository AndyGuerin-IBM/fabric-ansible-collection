---
state: present
# api_endpoint:
# api_authtype:
# api_key:
# api_secret:
# api_token_endpoint:
# organization_name:
# ca_admin_enrollment_id
# ca_admin_enrollment_secret
# organization_admin_enrollment_id:
# organization_admin_enrollment_secret:
# peer_enrollment_id
# peer_enrollment_secret
ca_name: "{{ organization_name }} CA"
# ca_resources:
# ca_storage:
# ca_version:
peers: 1
peer_name: "{{ organization_name }} Peer"
# peer_resources:
# peer_storage:
peer_state_db: couchdb
# peer_version:
# Kubernetes only. expose_ca, expose_peer: whether the certificate authority and the
# peers are reachable from the Ansible host. When a flag is false, the role
# never calls that component from the Ansible host: it waits for it through the
# Kubernetes API (k8s_component_ready module) and, for the certificate authority,
# registers and enrolls the identities in a Kubernetes Job (k8s_identity_bootstrap
# module). This needs the kubernetes Python library, a kubeconfig, and namespace.
expose_ca: true
expose_peer: true
# namespace: the Kubernetes namespace of the console and of the components it
# creates. Only used when a component is not exposed.
namespace: ""
# k8s_jobs: options of the Kubernetes Jobs and API calls, passed to the
# k8s_identity_bootstrap and k8s_component_ready modules: kubeconfig, context,
# images, image_pull_policy, image_pull_secrets, host_aliases, job_timeout,
# ca_url, name_prefix, service_account, manage_service_account.
k8s_jobs: {}
# k8s_wait_timeout: the timeout, in seconds, to wait for a component that is not exposed.
k8s_wait_timeout: 600
wallet: "{{ playbook_dir }}"
ca_admin_identity: "{{ wallet }}/{{ ca_name }} Admin.json"
organization_admin_identity: "{{ wallet }}/{{ organization_name }} Admin.json"
