---
- name: Deploy Fabric Operations Console & CRDs
  hosts: localhost
  vars_files:
    - common-vars.yml
  vars:
    state: present
    target: "{{ k8s_target | default('k8s') }}"
    arch: "{{ console_arch | default('amd64') }}"
    namespace: "{{ k8s_namespace | default('default') }}"
    console_name: "{{ hlf_console_name | default('hlf-console') }}"
    console_domain: "{{ hlf_console_domain | default('127-0-0-1.nip.io') }}"
    console_email: "{{ console_email | default('admin@example.com') }}"
    console_default_password: "{{ console_default_password | default('password') }}"
    console_storage_class: "{{ console_storage_class | default('standard') }}"
    console_storage_size: "{{ storage_size | default('5Gi') }}"
    service_account: "{{ console_service_account | default('default') }}"
    image_pull_secret: "{{ console_image_pull_secret | default('ghcr-pull-secret') }}"
    deployer_image: ghcr.io/ibm-blockchain/fabric-deployer
    deployer_image_label: latest-amd64
    console_image: ghcr.io/hyperledger-labs/fabric-console
    console_image_label: latest
    init_image: registry.access.redhat.com/ubi8/ubi-minimal
    init_image_label: latest
    couchdb_image: couchdb
    couchdb_image_label: 3.2.1
    tools_image: hyperledger/fabric-tools
    tools_image_label: 2.4.4
    wait_timeout: "{{ wait_timeout | default(600) }}"
  # Before the roles: a bad domain combination fails before any change to the cluster.
  pre_tasks:
    - name: Compute the network domains
      ansible.builtin.include_role:
        name: hyperledger.fabric_ansible_collection.network_domains
        public: true
      vars:
        network_domains_namespace: "{{ namespace }}"
        network_domains_console_name: "{{ console_name }}"

  roles:
    - hyperledger.fabric_ansible_collection.fabric_operator_crds

  tasks:
    - name: Determine if console exists
      kubernetes.core.k8s_info:
        namespace: "{{ namespace }}"
        api_version: ibp.com/v1beta1
        kind: IBPConsole
        name: "{{ console_name }}"
      register: existing_console

    - name: Create or update Fabric Operations Console
      kubernetes.core.k8s:
        state: present
        namespace: "{{ namespace }}"
        apply: true
        definition: "{{ _console | combine(_console_domains, recursive=true) }}"
      vars:
        # spec.deployer.domain and spec.ingress.class only when needed: with no
        # new variable, the CR is the same as before (MIGRATION-STEP-1 sub-task 1.5).
        _console_domains:
          spec: >-
            {{ ({'deployer': {'domain': hlf_node_domain}}
                if hlf_node_domain != network_domains_exposed_domain else {})
               | combine({'ingress': {'class': unexposed_ingress_class}}
                         if not expose_console | bool else {}) }}
        _console:
          apiVersion: ibp.com/v1beta1
          kind: IBPConsole
          metadata:
            name: "{{ console_name }}"
          spec:
            arch:
              - "{{ arch }}"
            license:
              accept: true
            serviceAccountName: "{{ service_account }}"
            email: "{{ console_email }}"
            password: "{{ console_default_password }}"
            allowDefaultPassword: true
            imagePullSecrets:
              - "{{ image_pull_secret }}"
            networkinfo:
              domain: "{{ network_domains_exposed_domain }}"
            images:
              deployerImage: "{{ deployer_image }}"
              deployerTag: "{{ deployer_image_label }}"
              consoleInitImage: "{{ init_image }}"
              consoleInitTag: "{{ init_image_label }}"
              consoleImage: "{{ console_image }}"
              consoleTag: "{{ console_image_label }}"
              configtxlatorImage: "{{ tools_image }}"
              configtxlatorTag: "{{ tools_image_label }}"
              couchdbImage: "{{ couchdb_image }}"
              couchdbTag: "{{ couchdb_image_label }}"
            storage:
              console:
                class: "{{ console_storage_class }}"
                size: "{{ console_storage_size }}"
            usetags: true
            version: 1.0.0
            resources:
              init:
                limits:
                  cpu: 100m
                  memory: 200M
                requests:
                  cpu: 10m
                  memory: 20M
              configtxlator:
                limits:
                  cpu: 25m
                  ephemeral-storage: 1G
                  memory: 50Mi
                requests:
                  cpu: 25m
                  ephemeral-storage: 100M
                  memory: 50Mi
              couchdb:
                limits:
                  cpu: 500m
                  ephemeral-storage: 1Gi
                  memory: 2Gi
                requests:
                  cpu: 50m
                  ephemeral-storage: 100Mi
                  memory: 256Mi
              deployer:
                limits:
                  cpu: 100m
                  ephemeral-storage: 1G
                  memory: 200Mi
                requests:
                  cpu: 100m
                  ephemeral-storage: 100M
                  memory: 128Mi
              console:
                limits:
                  cpu: 500m
                  ephemeral-storage: 1G
                  memory: 2Gi
                requests:
                  cpu: 50m
                  ephemeral-storage: 100M
                  memory: 256Mi

    - name: Restart the console if its HLF node domain changed
      ansible.builtin.include_role:
        name: hyperledger.fabric_ansible_collection.network_domains
        tasks_from: console_domain_change
      vars:
        network_domains_namespace: "{{ namespace }}"
        network_domains_console_name: "{{ console_name }}"
        network_domains_live_console: "{{ existing_console.resources | first | default({}) }}"

    - name: Wait for console deployment to exist
      kubernetes.core.k8s_info:
        namespace: "{{ namespace }}"
        api_version: apps/v1
        kind: Deployment
        name: "{{ console_name }}"
      register: console_deployment
      until: console_deployment.resources
      retries: "{{ wait_timeout }}"
      delay: 1

    - name: Wait for console deployment to start
      kubernetes.core.k8s:
        state: present
        namespace: "{{ namespace }}"
        api_version: apps/v1
        kind: Deployment
        name: "{{ console_name }}"
        wait: true
        wait_timeout: "{{ wait_timeout }}"

    - name: Print console URL
      ansible.builtin.debug:
        msg: "Hyperledger Fabric Operations Console available at {{ console_url }}"
      when: expose_console | bool

    - name: Wait for the console and print how to reach it (not exposed)
      ansible.builtin.include_role:
        name: hyperledger.fabric_ansible_collection.network_domains
        tasks_from: console_not_exposed
      vars:
        network_domains_namespace: "{{ namespace }}"
        network_domains_console_name: "{{ console_name }}"
      when: not expose_console | bool
