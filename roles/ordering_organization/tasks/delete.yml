---
- name: Delete certificate authority
  hyperledger.fabric_ansible_collection.certificate_authority:
      state: "{{ state }}"
      api_endpoint: "{{ api_endpoint }}"
      api_authtype: "{{ api_authtype }}"
      api_key: "{{ api_key }}"
      api_secret: "{{ api_secret | default(omit) }}"
      api_token_endpoint: "{{ api_token_endpoint | default(omit) }}"
      api_timeout: "{{ api_timeout | default(omit) }}"
      name: "{{ ca_name }}"

- name: Delete certificate authority admin
  hyperledger.fabric_ansible_collection.enrolled_identity:
      state: "{{ state }}"
      api_endpoint: "{{ api_endpoint }}"
      api_authtype: "{{ api_authtype }}"
      api_key: "{{ api_key }}"
      api_secret: "{{ api_secret | default(omit) }}"
      api_token_endpoint: "{{ api_token_endpoint | default(omit) }}"
      api_timeout: "{{ api_timeout | default(omit) }}"
      path: "{{ ca_admin_identity }}"

- name: Delete organization admin
  hyperledger.fabric_ansible_collection.enrolled_identity:
      state: "{{ state }}"
      api_endpoint: "{{ api_endpoint }}"
      api_authtype: "{{ api_authtype }}"
      api_key: "{{ api_key }}"
      api_secret: "{{ api_secret | default(omit) }}"
      api_token_endpoint: "{{ api_token_endpoint | default(omit) }}"
      api_timeout: "{{ api_timeout | default(omit) }}"
      path: "{{ organization_admin_identity }}"

- name: Delete organization
  hyperledger.fabric_ansible_collection.organization:
      state: "{{ state }}"
      api_endpoint: "{{ api_endpoint }}"
      api_authtype: "{{ api_authtype }}"
      api_key: "{{ api_key }}"
      api_secret: "{{ api_secret | default(omit) }}"
      api_token_endpoint: "{{ api_token_endpoint | default(omit) }}"
      api_timeout: "{{ api_timeout | default(omit) }}"
      name: "{{ organization_name }}"

- name: Delete ordering service
  hyperledger.fabric_ansible_collection.ordering_service:
      state: "{{ state }}"
      api_endpoint: "{{ api_endpoint }}"
      api_authtype: "{{ api_authtype }}"
      api_key: "{{ api_key }}"
      api_secret: "{{ api_secret | default(omit) }}"
      api_token_endpoint: "{{ api_token_endpoint | default(omit) }}"
      api_timeout: "{{ api_timeout | default(omit) }}"
      name: "{{ ordering_service_name }}"

- name: Delete the organization admin and certificates published in Kubernetes
  kubernetes.core.k8s:
      state: absent
      namespace: "{{ namespace }}"
      kubeconfig: "{{ k8s_jobs.kubeconfig | default(omit) }}"
      context: "{{ k8s_jobs.context | default(omit) }}"
      api_version: "{{ item.api_version | default('v1') }}"
      kind: "{{ item.kind }}"
      name: "{{ item.name }}"
  loop:
      - {kind: Secret, name: "{{ k8s_jobs.name_prefix | default(namespace) }}-admin-key"}
      - {kind: ConfigMap, name: "{{ k8s_jobs.name_prefix | default(namespace) }}-admin-cert"}
      - {kind: ConfigMap, name: "{{ k8s_jobs.name_prefix | default(namespace) }}-ca-certs"}
      # The service account of the Job, unless it is managed elsewhere (manage_service_account: false).
      - {kind: RoleBinding, api_version: rbac.authorization.k8s.io/v1, name: "{{ k8s_jobs.service_account | default('fac-identity-bootstrap') }}", account: true}
      - {kind: Role, api_version: rbac.authorization.k8s.io/v1, name: "{{ k8s_jobs.service_account | default('fac-identity-bootstrap') }}", account: true}
      - {kind: ServiceAccount, name: "{{ k8s_jobs.service_account | default('fac-identity-bootstrap') }}", account: true}
  loop_control:
      label: "{{ item.kind }}/{{ item.name }}"
  when: not expose_ca | bool and (not item.account | default(false) or k8s_jobs.manage_service_account | default(true))
