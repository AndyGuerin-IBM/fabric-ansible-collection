---
- name: Fail if organization MSP ID not specified
  fail:
      msg: organization_msp_id not specified or is empty
  when: not organization_msp_id is defined or not organization_msp_id

- name: Fail if certificate authority admin enrollment ID not specified
  fail:
      msg: ca_admin_enrollment_id not specified or is empty
  when: not ca_admin_enrollment_id is defined or not ca_admin_enrollment_id

- name: Fail if certificate authority admin enrollment secret not specified
  fail:
      msg: ca_admin_enrollment_secret not specified or is empty
  when: not ca_admin_enrollment_secret is defined or not ca_admin_enrollment_secret

- name: Fail if organization admin enrollment ID not specified
  fail:
      msg: organization_admin_enrollment_id not specified or is empty
  when: not organization_admin_enrollment_id is defined or not organization_admin_enrollment_id

- name: Fail if organization admin enrollment secret not specified
  fail:
      msg: organization_admin_enrollment_secret not specified or is empty
  when: not organization_admin_enrollment_secret is defined or not organization_admin_enrollment_secret

- name: Fail if ordering service enrollment ID not specified
  fail:
      msg: ordering_service_enrollment_id not specified or is empty
  when: not ordering_service_enrollment_id is defined or not ordering_service_enrollment_id

- name: Fail if ordering service enrollment secret not specified
  fail:
      msg: ordering_service_enrollment_secret not specified or is empty
  when: not ordering_service_enrollment_secret is defined or not ordering_service_enrollment_secret

- name: Compute the network domains
  include_role:
      name: hyperledger.fabric_ansible_collection.network_domains
      public: true
  vars:
      network_domains_namespace: "{{ k8s_namespace | default('') }}"

- name: Get the CA if it exists already (unexposed)
  hyperledger.fabric_ansible_collection.certificate_authority_info:
      api_endpoint: "{{ api_endpoint }}"
      api_authtype: "{{ api_authtype }}"
      api_key: "{{ api_key }}"
      api_secret: "{{ api_secret | default(omit) }}"
      api_token_endpoint: "{{ api_token_endpoint | default(omit) }}"
      api_timeout: "{{ api_timeout | default(omit) }}"
      name: "{{ ca_name }}"
      wait_timeout: "{{ wait_timeout | default(omit) }}"
  register: ordering_organization_ca_info
  when: not expose_ca | bool

- name: Create per-endpoint Services for the CA (unexposed)
  include_role:
      name: hyperledger.fabric_ansible_collection.k8s_endpoint_services
  vars:
      k8s_endpoint_services_namespace: "{{ k8s_namespace }}"
      k8s_endpoint_services_component: ca
      k8s_endpoint_services_display_name: "{{ ca_name }}"
      k8s_endpoint_services_existing_urls: "{{ [ordering_organization_ca_info.certificate_authority.api_url | default('')] }}"
  when: not expose_ca | bool

- name: Create certificate authority
  hyperledger.fabric_ansible_collection.certificate_authority:
      state: "{{ state }}"
      api_endpoint: "{{ api_endpoint }}"
      api_authtype: "{{ api_authtype }}"
      api_key: "{{ api_key }}"
      api_secret: "{{ api_secret | default(omit) }}"
      api_token_endpoint: "{{ api_token_endpoint | default(omit) }}"
      api_timeout: "{{ api_timeout | default(omit) }}"
      name: "{{ ca_name }}"
      config_override:
          ca:
              registry:
                  maxenrollments: -1
                  identities:
                      - name: "{{ ca_admin_enrollment_id }}"
                        pass: "{{ ca_admin_enrollment_secret }}"
                        type: client
                        maxenrollments: -1
                        attrs:
                            hf.Registrar.Roles: "*"
                            hf.Registrar.DelegateRoles: "*"
                            hf.Revoker: true
                            hf.IntermediateCA: true
                            hf.GenCRL: true
                            hf.Registrar.Attributes: "*"
                            hf.AffiliationMgr: true
      resources: "{{ ca_resources | default(omit) }}"
      storage: "{{ ca_storage | default(omit) }}"
      version: "{{ ca_version | default(omit) }}"
      zone: "{{ ca_zone | default(omit) }}"
      wait_timeout: "{{ wait_timeout | default(omit) }}"
  register: ordering_organization_ca

- name: Check the CA URLs use the HLF node domain (V5)
  include_role:
      name: hyperledger.fabric_ansible_collection.network_domains
      tasks_from: verify_urls
  vars:
      network_domains_urls: >-
          {{ [ordering_organization_ca.certificate_authority.api_url, ordering_organization_ca.certificate_authority.operations_url] }}

- name: Verify per-endpoint Services for the CA (unexposed)
  include_role:
      name: hyperledger.fabric_ansible_collection.k8s_endpoint_services
      tasks_from: verify
  vars:
      k8s_endpoint_services_namespace: "{{ k8s_namespace }}"
      k8s_endpoint_services_component: ca
      k8s_endpoint_services_display_name: "{{ ca_name }}"
      k8s_endpoint_services_existing_urls: "{{ [ordering_organization_ca_info.certificate_authority.api_url | default('')] }}"
      k8s_endpoint_services_urls: >-
          {{ [ordering_organization_ca.certificate_authority.api_url, ordering_organization_ca.certificate_authority.operations_url] }}
  when: not expose_ca | bool

- name: Neutralize the Ingress of the CA (unexposed, opt-in)
  include_role:
      name: hyperledger.fabric_ansible_collection.k8s_endpoint_services
      tasks_from: neutralize_ingress
  vars:
      k8s_endpoint_services_namespace: "{{ k8s_namespace }}"
      k8s_endpoint_services_component: ca
      k8s_endpoint_services_ingress_class: "{{ unexposed_ingress_class }}"
      k8s_endpoint_services_urls: >-
          {{ [ordering_organization_ca.certificate_authority.api_url, ordering_organization_ca.certificate_authority.operations_url] }}
  when: neutralize_node_ingresses | bool and not expose_ca | bool

- name: Enroll certificate authority admin
  hyperledger.fabric_ansible_collection.enrolled_identity:
      state: "{{ state }}"
      api_endpoint: "{{ api_endpoint }}"
      api_authtype: "{{ api_authtype }}"
      api_key: "{{ api_key }}"
      api_secret: "{{ api_secret | default(omit) }}"
      api_token_endpoint: "{{ api_token_endpoint | default(omit) }}"
      api_timeout: "{{ api_timeout | default(omit) }}"
      certificate_authority: "{{ ca_name }}"
      name: "{{ ca_name }} Admin"
      enrollment_id: "{{ ca_admin_enrollment_id }}"
      enrollment_secret: "{{ ca_admin_enrollment_secret }}"
      path: "{{ ca_admin_identity }}"

- name: Register the organization admin
  hyperledger.fabric_ansible_collection.registered_identity:
      state: "{{ state }}"
      api_endpoint: "{{ api_endpoint }}"
      api_authtype: "{{ api_authtype }}"
      api_key: "{{ api_key }}"
      api_secret: "{{ api_secret | default(omit) }}"
      api_token_endpoint: "{{ api_token_endpoint | default(omit) }}"
      api_timeout: "{{ api_timeout | default(omit) }}"
      certificate_authority: "{{ ca_name }}"
      registrar: "{{ ca_admin_identity }}"
      enrollment_id: "{{ organization_admin_enrollment_id }}"
      enrollment_secret: "{{ organization_admin_enrollment_secret }}"
      max_enrollments: -1
      type: admin

- name: Register the ordering service
  hyperledger.fabric_ansible_collection.registered_identity:
      state: "{{ state }}"
      api_endpoint: "{{ api_endpoint }}"
      api_authtype: "{{ api_authtype }}"
      api_key: "{{ api_key }}"
      api_secret: "{{ api_secret | default(omit) }}"
      api_token_endpoint: "{{ api_token_endpoint | default(omit) }}"
      api_timeout: "{{ api_timeout | default(omit) }}"
      certificate_authority: "{{ ca_name }}"
      registrar: "{{ ca_admin_identity }}"
      enrollment_id: "{{ ordering_service_enrollment_id }}"
      enrollment_secret: "{{ ordering_service_enrollment_secret }}"
      max_enrollments: -1
      type: orderer

- name: Enroll the organization admin
  hyperledger.fabric_ansible_collection.enrolled_identity:
      state: "{{ state }}"
      api_endpoint: "{{ api_endpoint }}"
      api_authtype: "{{ api_authtype }}"
      api_key: "{{ api_key }}"
      api_secret: "{{ api_secret | default(omit) }}"
      api_token_endpoint: "{{ api_token_endpoint | default(omit) }}"
      api_timeout: "{{ api_timeout | default(omit) }}"
      certificate_authority: "{{ ca_name }}"
      name: "{{ organization_name }} Admin"
      enrollment_id: "{{ organization_admin_enrollment_id }}"
      enrollment_secret: "{{ organization_admin_enrollment_secret }}"
      path: "{{ organization_admin_identity }}"
  register: ordering_organization_org_admin

- name: Create organization
  hyperledger.fabric_ansible_collection.organization:
      state: "{{ state }}"
      api_endpoint: "{{ api_endpoint }}"
      api_authtype: "{{ api_authtype }}"
      api_key: "{{ api_key }}"
      api_secret: "{{ api_secret | default(omit) }}"
      api_token_endpoint: "{{ api_token_endpoint | default(omit) }}"
      api_timeout: "{{ api_timeout | default(omit) }}"
      name: "{{ organization_name }}"
      msp_id: "{{ organization_msp_id }}"
      certificate_authority: "{{ ca_name }}"
      registrar: "{{ ca_admin_identity }}"
      admins:
          - "{{ ordering_organization_org_admin.enrolled_identity.cert | default(omit) }}"

- name: Get the ordering service if it exists already (unexposed)
  hyperledger.fabric_ansible_collection.ordering_service_info:
      api_endpoint: "{{ api_endpoint }}"
      api_authtype: "{{ api_authtype }}"
      api_key: "{{ api_key }}"
      api_secret: "{{ api_secret | default(omit) }}"
      api_token_endpoint: "{{ api_token_endpoint | default(omit) }}"
      api_timeout: "{{ api_timeout | default(omit) }}"
      name: "{{ ordering_service_name }}"
      wait_timeout: "{{ wait_timeout | default(omit) }}"
  register: ordering_organization_os_info
  when: not expose_orderer | bool

- name: Create per-endpoint Services for the ordering nodes (unexposed)
  include_role:
      name: hyperledger.fabric_ansible_collection.k8s_endpoint_services
  vars:
      k8s_endpoint_services_namespace: "{{ k8s_namespace }}"
      k8s_endpoint_services_component: orderer
      k8s_endpoint_services_display_name: "{{ ordering_service_name }}"
      k8s_endpoint_services_count: "{{ ordering_service_nodes }}"
      k8s_endpoint_services_existing_urls: >-
          {{ ordering_organization_os_info.ordering_service | default([]) | map(attribute='api_url') | list }}
  when: not expose_orderer | bool

- name: Create ordering service
  hyperledger.fabric_ansible_collection.ordering_service:
      state: "{{ state }}"
      api_endpoint: "{{ api_endpoint }}"
      api_authtype: "{{ api_authtype }}"
      api_key: "{{ api_key }}"
      api_secret: "{{ api_secret | default(omit) }}"
      api_token_endpoint: "{{ api_token_endpoint | default(omit) }}"
      api_timeout: "{{ api_timeout | default(omit) }}"
      name: "{{ ordering_service_name }}"
      msp_id: "{{ organization_msp_id }}"
      nodes: "{{ ordering_service_nodes }}"
      certificate_authority: "{{ ca_name }}"
      enrollment_id: "{{ ordering_service_enrollment_id }}"
      enrollment_secret: "{{ ordering_service_enrollment_secret }}"
      admin_certificates:
          - "{{ ordering_organization_org_admin.enrolled_identity.cert | default(omit) }}"
      resources: "{{ ordering_service_resources | default(omit) }}"
      storage: "{{ ordering_service_storage | default(omit) }}"
      version: "{{ ordering_service_version | default(omit) }}"
      zones: "{{ ordering_service_zones | default(omit) }}"
      wait_timeout: "{{ wait_timeout | default(omit) }}"
  register: ordering_organization_os

- name: List the URLs returned for the ordering nodes
  set_fact:
      ordering_organization_os_urls: >-
          {{ ordering_organization_os.ordering_service | map(attribute='api_url', default='') | list
             + ordering_organization_os.ordering_service | map(attribute='operations_url', default='') | list
             + ordering_organization_os.ordering_service | map(attribute='grpcwp_url', default='') | list
             + ordering_organization_os.ordering_service | map(attribute='osnadmin_url', default='') | list }}

- name: Check the ordering node URLs use the HLF node domain (V5)
  include_role:
      name: hyperledger.fabric_ansible_collection.network_domains
      tasks_from: verify_urls
  vars:
      network_domains_urls: "{{ ordering_organization_os_urls }}"

- name: Verify per-endpoint Services for the ordering nodes (unexposed)
  include_role:
      name: hyperledger.fabric_ansible_collection.k8s_endpoint_services
      tasks_from: verify
  vars:
      k8s_endpoint_services_namespace: "{{ k8s_namespace }}"
      k8s_endpoint_services_component: orderer
      k8s_endpoint_services_display_name: "{{ ordering_service_name }}"
      k8s_endpoint_services_count: "{{ ordering_service_nodes }}"
      k8s_endpoint_services_existing_urls: >-
          {{ ordering_organization_os_info.ordering_service | default([]) | map(attribute='api_url') | list }}
      k8s_endpoint_services_urls: "{{ ordering_organization_os_urls }}"
  when: not expose_orderer | bool

- name: Neutralize the Ingresses of the ordering nodes (unexposed, opt-in)
  include_role:
      name: hyperledger.fabric_ansible_collection.k8s_endpoint_services
      tasks_from: neutralize_ingress
  vars:
      k8s_endpoint_services_namespace: "{{ k8s_namespace }}"
      k8s_endpoint_services_component: orderer
      k8s_endpoint_services_ingress_class: "{{ unexposed_ingress_class }}"
      k8s_endpoint_services_urls: "{{ ordering_organization_os_urls }}"
  when: neutralize_node_ingresses | bool and not expose_orderer | bool
