---
name: FV Testing using KIND
on:
  workflow_dispatch:

jobs:
  setup:
    name: FV test (nginx / ${{ matrix.scenario }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # expose-all: scenario A, everything through nginx, tests run on this runner.
        # expose-none: scenario C, nothing exposed, node FQDNs rewritten by CoreDNS.
        # expose-none-internal: scenario B, nothing exposed, node FQDNs are Service FQDNs.
        # The two unexposed legs run the tests from inside the cluster (in-cluster Job).
        # Step 2: add the gateway-api legs here (ingress_type: gateway-api).
        scenario: [expose-all, expose-none, expose-none-internal]
    steps:
      - uses: actions/checkout@v4
      - name: Use Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - uses: BSFishy/pip-action@v1
        with:
          requirements: requirements.txt
      - name: Create k8s Kind Cluster
        uses: helm/kind-action@v1.4.0
        with:
          install_only: true
      - name: Scenario variables
        # Read by kind_with_nginx.sh (CoreDNS rules, sub-task 1.8), the console
        # deployment and run-tests.sh (common-vars.yml, sub-task 1.3).
        run: |
          set -xe
          if [ "${{ matrix.scenario }}" = "expose-all" ]; then EXPOSE=true; else EXPOSE=false; fi
          {
            echo "INGRESS_TYPE=nginx"
            echo "EXPOSE_CONSOLE=${EXPOSE}"
            echo "EXPOSE_CA=${EXPOSE}"
            echo "EXPOSE_PEER=${EXPOSE}"
            echo "EXPOSE_ORDERER=${EXPOSE}"
            echo "NAMESPACE=default"
            echo "CONSOLE_NAME=hlf-console"
          } >> "$GITHUB_ENV"
          if [ "${{ matrix.scenario }}" = "expose-none-internal" ]; then
            echo "HLF_NETWORK_DOMAIN=cluster.local" >> "$GITHUB_ENV"
            echo "CLUSTER_DOMAIN=cluster.local" >> "$GITHUB_ENV"
          fi
      - name: Setup and create the KIND cluster
        run: |
          set -xev
          # determine the IP Address of the Host running this
          export KIND_API_SERVER_ADDRESS=$(sh .github/scripts/get-host-ip.sh)

          # Start KIND with correct configuration and the API port exposed on the above Address
          # kind_with_nginx.sh writes _cfg/k8s_context.yaml via 'kind get kubeconfig'
          .github/scripts/kind_with_nginx.sh

          # also need to use API address as a domain name for the operations Console
          # use nip.io here to resolve
          TEST_NETWORK_INGRESS_DOMAIN=$(echo "$KIND_API_SERVER_ADDRESS" | tr -s '.' '-').nip.io
          echo "TEST_NETWORK_INGRESS_DOMAIN=${TEST_NETWORK_INGRESS_DOMAIN}" >> "$GITHUB_ENV"
          echo "KUBECONFIG=${PWD}/_cfg/k8s_context.yaml" >> "$GITHUB_ENV"
          echo "console_domain: ${TEST_NETWORK_INGRESS_DOMAIN}" >> _cfg/domain.yml
          # Scenario C: the organization roles build the node FQDNs from the
          # exposed domain (sub-task 1.1). Scenario B does not use it.
          if [ "${{ matrix.scenario }}" = "expose-none" ]; then
            echo "EXPOSED_DOMAIN=${TEST_NETWORK_INGRESS_DOMAIN}" >> "$GITHUB_ENV"
          fi
      - name: Build collection
        run: |
          ansible-galaxy collection build -f
          ansible-galaxy collection install $(ls -1 | grep fabric_ansible_collection) -f
      - name: network_domains rules
        run: tests/network_domains/run.sh
      - name: Deploy Fabric Operator and Console
        run: |
          # The console is created with the scenario variables (spec.deployer.domain
          # is read only at creation, finding F1).
          source .github/scripts/scenario-vars.sh
          patch_scenario_vars tutorial/common-vars.yml
          print_scenario_vars tutorial/common-vars.yml
          ansible-playbook -i localhost, -c local \
            -e k8s_target=k8s \
            -e console_arch=amd64 \
            -e k8s_namespace=default \
            -e wait_timeout=600 \
            -e hlf_console_name=hlf-console \
            -e hlf_console_domain="${TEST_NETWORK_INGRESS_DOMAIN}" \
            -e console_email=admin@example.com \
            -e console_default_password=password \
            -e console_storage_class=standard \
            tutorial/00-deploy-fabric-console.yml
          echo "API_ENDPOINT=https://default-hlf-console-console.${TEST_NETWORK_INGRESS_DOMAIN}" >> "$GITHUB_ENV"
          echo "API_AUTHTYPE=basic" >> "$GITHUB_ENV"
          echo "API_KEY=admin@example.com" >> "$GITHUB_ENV"
          echo "API_SECRET=password" >> "$GITHUB_ENV"
          echo "K8S_NAMESPACE=default" >> "$GITHUB_ENV"
      - name: Install the 2.4.7 release specifically
        uses: hyperledgendary/setup-hyperledger-fabric-action@v0.0.1
        with:
          version: 2.4.7
      - name: Run the tests
        if: matrix.scenario == 'expose-all'
        run: |
          .github/scripts/run-tests.sh

      # In-cluster runner (unexposed legs): the node FQDNs only resolve inside
      # the cluster, so run-tests.sh runs in a Job (MIGRATION-STEP-1 sub-task 1.9).
      - name: Build and load the runner image
        if: matrix.scenario != 'expose-all'
        run: |
          set -xe
          docker build -t fabric-ansible-collection:ci .
          docker build -t ansible-runner:ci -f .github/docker/ansible-runner/Dockerfile .
          kind load docker-image ansible-runner:ci
      - name: Apply the runner RBAC
        if: matrix.scenario != 'expose-all'
        run: kubectl apply -f .github/k8s/ansible-runner-rbac.yml
      - name: Deploy the chaincode server
        # The Job has neither docker nor the rights to create a Deployment: this
        # runner builds and deploys the CCaaS server, the Job only writes the
        # package (CCAAS_PACKAGE_ONLY).
        if: matrix.scenario != 'expose-all'
        run: tutorial/deploy_chaincode_server.sh deploy
      - name: Create the Job inputs
        if: matrix.scenario != 'expose-all'
        run: |
          set -e
          kubectl create configmap ansible-runner-env \
            --from-literal=API_ENDPOINT="https://${CONSOLE_NAME}.${K8S_NAMESPACE}.svc.${CLUSTER_DOMAIN:-cluster.local}:3000" \
            --from-literal=API_AUTHTYPE="${API_AUTHTYPE}" --from-literal=API_KEY="${API_KEY}" \
            --from-literal=K8S_NAMESPACE="${K8S_NAMESPACE}" --from-literal=KEEP_NETWORK=true \
            --from-literal=TEST_RUN_ID="$(openssl rand -hex 20)" \
            --from-literal=INGRESS_TYPE="${INGRESS_TYPE}" \
            --from-literal=EXPOSE_CONSOLE="${EXPOSE_CONSOLE}" --from-literal=EXPOSE_CA="${EXPOSE_CA}" \
            --from-literal=EXPOSE_PEER="${EXPOSE_PEER}" --from-literal=EXPOSE_ORDERER="${EXPOSE_ORDERER}" \
            --from-literal=EXPOSED_DOMAIN="${EXPOSED_DOMAIN:-}" \
            --from-literal=HLF_NETWORK_DOMAIN="${HLF_NETWORK_DOMAIN:-}" \
            --from-literal=CLUSTER_DOMAIN="${CLUSTER_DOMAIN:-}" \
            --from-literal=NEUTRALIZE_NODE_INGRESSES="${NEUTRALIZE_NODE_INGRESSES:-}" \
            --from-literal=CCAAS_PACKAGE_ONLY=true \
            --from-literal=WAIT_TIMEOUT=1800
          kubectl create secret generic ansible-runner-auth --from-literal=API_SECRET="${API_SECRET}"
      - name: Run the tests in the cluster
        if: matrix.scenario != 'expose-all'
        run: |
          kubectl apply -f .github/k8s/ansible-runner-job.yml
          .github/scripts/wait-job.sh ansible-runner 3600
      - name: Logs of the tests
        if: always() && matrix.scenario != 'expose-all'
        run: kubectl logs job/ansible-runner --all-containers || true
      - name: Verify unexposed reachability
        # The network is still alive: the destroy step below removes it.
        if: matrix.scenario != 'expose-all'
        run: .github/scripts/verify-unexposed-reachability.sh
      - name: Destroy the network
        if: always() && matrix.scenario != 'expose-all'
        run: |
          yq -y '.metadata.name = "ansible-runner-destroy"
                 | .spec.template.spec.containers[0].env += [{"name": "RUN_TESTS_MODE", "value": "destroy"}]' \
            .github/k8s/ansible-runner-job.yml | kubectl apply -f -
          status=0
          .github/scripts/wait-job.sh ansible-runner-destroy 1800 || status=$?
          kubectl logs job/ansible-runner-destroy --all-containers || true
          tutorial/deploy_chaincode_server.sh destroy
          exit "${status}"
